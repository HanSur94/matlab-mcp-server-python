services:
  matlab-mcp:
    build:
      context: .
      args:
        MATLAB_RELEASE: r2025a
    ports:
      - "8765:8765"
    shm_size: "512m"  # MATLAB needs shared memory
    environment:
      # REQUIRED: network license manager address (port@host). A licensed
      # engine cannot run in this container without one — the fail-fast
      # `:?` guard means compose refuses to start rather than silently
      # defaulting. Never echo this value.
      - MLM_LICENSE_FILE=${MLM_LICENSE_FILE:?set MLM_LICENSE_FILE=port@host}
      - MATLAB_MCP_SERVER_TRANSPORT=streamablehttp
      - MATLAB_MCP_POOL_MAX_ENGINES=2  # each engine = 1 license seat
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./custom_tools.yaml:/app/custom_tools.yaml:ro
      - results:/app/results
      - monitoring_data:/app/monitoring

volumes:
  results:
  monitoring_data:
