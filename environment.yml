# DEPRECATED: superseded by the pixi workflow (pixi.toml + committed pixi.lock).
# This file is kept for one release for backward compatibility and will be
# removed afterwards. Prefer pixi for new installs:
#   pixi run start
#   pixi run install-engine
# See https://pixi.sh and README.md for the pixi quickstart.
#
# Standalone install — works without cloning the repo.
# Downloads matlab-mcp-python from PyPI.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate matlab-mcp
#   matlab-mcp --inspect
name: matlab-mcp
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
    - matlab-mcp-python[monitoring]
