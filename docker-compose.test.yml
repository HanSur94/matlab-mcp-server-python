# Docker Compose test configuration for remote MCP integration test.
#
# Simulates two-machine scenario: PC A (client) connecting to PC B (server)
# over a Docker network with bearer auth.
#
# The server builds the same mathworks/matlab image as docker-compose.yml (see
# Dockerfile) but runs in --inspect mode (engine-free) since generic CI has no
# MATLAB license and cannot start real engines. The client is a stock
# python:3.12-slim image — it never builds the licensed image. The real image
# build/run is gated behind a MATLAB-license-available CI flag — see
# 08-VALIDATION.md.
#
# Usage:
#   docker compose -f docker-compose.test.yml up --build --exit-code-from client
#   docker compose -f docker-compose.test.yml down -v

services:
  server:
    build:
      context: .
      args:
        MATLAB_RELEASE: r2025a
    command: ["--inspect", "--transport", "streamablehttp"]
    environment:
      - MATLAB_MCP_AUTH_TOKEN=test-token-for-ci
      - MATLAB_MCP_POOL_MIN_ENGINES=0
      - MATLAB_MCP_SERVER_HOST=0.0.0.0
    networks:
      - mcp-test-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('localhost',8765),timeout=2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  client:
    # A stock Python image — the client only pip-installs mcp/httpx and runs
    # remote_client.py, so it must NOT build the multi-GB licensed
    # mathworks/matlab image (that is the server's job).
    image: python:3.12-slim
    entrypoint:
      - "sh"
      - "-c"
      - "pip3 install --quiet mcp httpx && python3 /app/tests/remote_client.py"
    volumes:
      - ./tests/remote_client.py:/app/tests/remote_client.py:ro
    environment:
      - MCP_SERVER_URL=http://server:8765/mcp
      - MCP_AUTH_TOKEN=test-token-for-ci
    networks:
      - mcp-test-net
    depends_on:
      server:
        condition: service_healthy

networks:
  mcp-test-net:
    driver: bridge
